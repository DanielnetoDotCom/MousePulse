name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Version = <major>.<minor> from the csproj <Version> + the workflow run number as the patch.
      # To bump major/minor, edit <Version> in src/MousePulse/MousePulse.csproj (e.g. 1.1.0).
      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/MousePulse/MousePulse.csproj
          $base = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $parts = $base.Split('.')
          $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Test
        run: dotnet test tests/MousePulse.Tests/MousePulse.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish src/MousePulse/MousePulse.csproj -c Release -r win-x64 -o dist -p:Version=${{ steps.version.outputs.version }}

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/MousePulse.exe -Algorithm SHA256).Hash
          "$hash  MousePulse.exe" | Out-File dist/MousePulse.exe.sha256 -Encoding ascii
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v5
        with:
          name: MousePulse-${{ steps.version.outputs.version }}
          path: |
            dist/MousePulse.exe
            dist/MousePulse.exe.sha256

      - name: Create GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "v$v" dist/MousePulse.exe dist/MousePulse.exe.sha256 `
            --target "${{ github.sha }}" `
            --title "MousePulse $v" `
            --generate-notes
