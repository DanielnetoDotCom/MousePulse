name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Version = <major>.<minor> from the csproj <Version> + the workflow run number as the patch.
      # To bump major/minor, edit <Version> in src/MousePulse/MousePulse.csproj (e.g. 1.1.0).
      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/MousePulse/MousePulse.csproj
          $base = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $parts = $base.Split('.')
          $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Test
        run: dotnet test tests/MousePulse.Tests/MousePulse.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish src/MousePulse/MousePulse.csproj -c Release -r win-x64 -o dist -p:Version=${{ steps.version.outputs.version }}

      # The file name carries the version (MousePulse-1.0.4.exe); the assembly name stays MousePulse.
      - name: Rename and checksum
        id: exe
        shell: pwsh
        run: |
          $name = "MousePulse-${{ steps.version.outputs.version }}.exe"
          Rename-Item dist/MousePulse.exe $name
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash
          "$hash  $name" | Out-File "dist/$name.sha256" -Encoding ascii
          "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "$name SHA-256: $hash"

      - uses: actions/upload-artifact@v6
        with:
          name: MousePulse-${{ steps.version.outputs.version }}
          path: |
            dist/${{ steps.exe.outputs.name }}
            dist/${{ steps.exe.outputs.name }}.sha256

      - name: Create GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $exe = "dist/${{ steps.exe.outputs.name }}"
          gh release create "v$v" $exe "$exe.sha256" `
            --target "${{ github.sha }}" `
            --title "MousePulse $v" `
            --generate-notes
